<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Note - Minimal Notepad</title>
        <meta
            name="description"
            content="A fast, minimal notepad in your browser. Write multiple notes with autosave, pure-black dark mode, and .txt download. No account needed."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Note - Minimal Notepad" />
        <meta
            property="og:description"
            content="A fast, minimal notepad in your browser. Multiple notes, autosave, dark mode, and .txt download."
        />
        <meta
            name="theme-color"
            content="#faf8f3"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#000000"
            media="(prefers-color-scheme: dark)"
        />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Ctext x='32' y='47' font-family='-apple-system,Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' text-anchor='middle' fill='%23fff'%3En%3C/text%3E%3C/svg%3E"
        />
        <script>
            /* Apply saved theme before first paint to avoid a flash */
            (function () {
                var t = localStorage.getItem("note.theme");
                if (!t)
                    t = matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                document.documentElement.dataset.theme = t;
            })();
        </script>
        <style>
            :root {
                --bg: #faf8f3;
                --ink: #1f1d1a;
                --faint: #8f8a80;
                --line: #e7e3da;
                --accent: #d97706;
                --font:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                    Arial, sans-serif;
            }
            [data-theme="dark"] {
                --bg: #000;
                --ink: #d8d4cc;
                --faint: #5c5952;
                --line: #1c1c1c;
                --accent: #f59e0b;
            }

            * {
                margin: 0;
                box-sizing: border-box;
            }

            html,
            body {
                height: 100%;
            }

            body {
                background: var(--bg);
                color: var(--ink);
                font-family: var(--font);
                display: flex;
                flex-direction: column;
                transition:
                    background 0.25s ease,
                    color 0.25s ease;
            }

            header {
                position: relative;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.75rem 1.1rem;
                border-bottom: 1px solid var(--line);
            }

            .doc-title {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                max-width: 38vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 0.8rem;
                color: var(--faint);
            }

            .wordmark {
                font-weight: 600;
                font-size: 1.1rem;
                letter-spacing: -0.02em;
                margin-left: 0.65rem;
                user-select: none;
            }
            .wordmark::after {
                content: ".";
                color: var(--accent);
            }

            button {
                font: inherit;
                font-size: 0.7rem;
                letter-spacing: 0.08em;
                color: var(--faint);
                background: none;
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 0.3rem 0.75rem;
                cursor: pointer;
                transition:
                    color 0.15s ease,
                    border-color 0.15s ease,
                    background 0.15s ease;
            }
            button:hover {
                color: var(--ink);
                border-color: var(--faint);
            }
            button:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            .icon {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2.1rem;
                height: 2.1rem;
                padding: 0;
            }
            .icon svg {
                width: 15px;
                height: 15px;
            }
            #download {
                margin-left: auto;
            }

            /* ---------- Layout: sidebar + editor ---------- */

            main {
                flex: 1;
                display: flex;
                min-height: 0;
                position: relative;
            }

            #sidebar {
                display: flex;
                flex-direction: column;
                width: 16rem;
                min-height: 0;
                background: var(--bg);
                border-right: 1px solid var(--line);
            }
            body.no-sidebar #sidebar {
                display: none;
            }

            .side-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0.7rem 0.7rem 0.4rem 1rem;
            }
            .side-head h2 {
                font-size: 0.68rem;
                font-weight: 600;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                color: var(--faint);
            }
            #new-note {
                width: 1.7rem;
                height: 1.7rem;
            }

            #note-list {
                flex: 1;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--line) transparent;
                list-style: none;
                padding: 0 0.6rem 0.8rem;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .note-item {
                display: flex;
                align-items: center;
                border-radius: 0.5rem;
            }
            .note-item:hover {
                background: color-mix(in srgb, var(--line) 55%, transparent);
            }
            .note-item.active {
                background: var(--line);
            }
            .note-open {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 0.15rem;
                text-align: left;
                border: none;
                border-radius: 0.5rem;
                padding: 0.5rem 0.2rem 0.5rem 0.65rem;
                letter-spacing: 0;
            }
            .note-title {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 0.8rem;
            }
            .note-time {
                font-size: 0.65rem;
                color: var(--faint);
            }
            .note-item.active .note-title {
                color: var(--ink);
            }
            .note-del {
                border: none;
                padding: 0.15rem 0.5rem;
                font-size: 0.9rem;
                line-height: 1;
                opacity: 0;
            }
            .note-del:hover {
                color: #dc2626;
            }
            .note-item:hover .note-del,
            .note-item.active .note-del,
            .note-del:focus-visible {
                opacity: 1;
            }

            .editor {
                flex: 1;
                display: flex;
                min-width: 0;
            }
            .sheet {
                flex: 1;
                display: flex;
                flex-direction: column;
                width: 100%;
                max-width: 44rem;
                margin: 0 auto;
                padding: 1.6rem 1.5rem 0;
            }

            #title {
                border: none;
                background: transparent;
                color: inherit;
                font: inherit;
                font-size: 1.5rem;
                font-weight: 650;
                letter-spacing: -0.02em;
                padding: 0 0 0.7rem;
                caret-color: var(--accent);
            }
            #title:focus {
                outline: none;
            }
            #title::placeholder {
                color: var(--faint);
                opacity: 0.5;
            }

            textarea {
                flex: 1;
                width: 100%;
                padding: 0.2rem 0 1.5rem;
                border: none;
                resize: none;
                background: transparent;
                color: inherit;
                font: inherit;
                font-size: 0.95rem;
                line-height: 1.8;
                caret-color: var(--accent);
                scrollbar-width: thin;
                scrollbar-color: var(--line) transparent;
            }
            textarea:focus {
                outline: none;
            }
            textarea::placeholder,
            #title::placeholder {
                color: var(--faint);
                opacity: 0.6;
            }
            ::selection {
                background: var(--accent);
                color: var(--bg);
            }

            .status {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                padding: 0.55rem 0 0.8rem;
                border-top: 1px solid var(--line);
                font-size: 0.68rem;
                letter-spacing: 0.04em;
                color: var(--faint);
                user-select: none;
            }

            /* On small screens the sidebar becomes an overlay drawer */
            #scrim {
                display: none;
            }
            @media (max-width: 720px) {
                #sidebar {
                    position: absolute;
                    inset: 0 auto 0 0;
                    width: min(16rem, 82vw);
                    z-index: 5;
                    box-shadow: 10px 0 30px rgba(0, 0, 0, 0.15);
                }
                body:not(.no-sidebar) #scrim {
                    display: block;
                    position: absolute;
                    inset: 0;
                    z-index: 4;
                    background: rgba(0, 0, 0, 0.35);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                * {
                    transition: none !important;
                    animation: none !important;
                }
            }

            /* ---------- Settings modal ---------- */

            .overlay {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(3px);
                z-index: 10;
                animation: fade 0.15s ease;
            }
            .overlay[hidden] {
                display: none;
            }

            .modal {
                width: min(26rem, calc(100% - 2.5rem));
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 0.9rem;
                box-shadow: 0 24px 60px rgba(0, 0, 0, 0.3);
                overflow: hidden;
                animation: pop 0.18s ease;
            }
            [data-theme="dark"] .modal {
                border-color: #262626;
            }
            @keyframes fade {
                from {
                    opacity: 0;
                }
            }
            @keyframes pop {
                from {
                    opacity: 0;
                    transform: scale(0.96) translateY(8px);
                }
            }

            .modal-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1.1rem 1.4rem;
                border-bottom: 1px solid var(--line);
            }
            .modal-head h2 {
                font-weight: 600;
                font-size: 1rem;
                letter-spacing: -0.01em;
            }
            .modal-head button {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 1.8rem;
                height: 1.8rem;
                padding: 0;
                border: none;
                border-radius: 50%;
                font-size: 1.05rem;
                line-height: 1;
            }
            .modal-head button:hover {
                background: var(--line);
            }

            .modal-body {
                padding: 0.3rem 1.4rem 1.2rem;
            }

            .modal .row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1.5rem;
                padding: 1rem 0;
            }
            .modal .row + .row {
                border-top: 1px solid var(--line);
            }
            .row-label {
                display: flex;
                flex-direction: column;
                gap: 0.2rem;
            }
            .row-label strong {
                font-size: 0.85rem;
                font-weight: 500;
            }
            .row-label span {
                font-size: 0.72rem;
                color: var(--faint);
            }

            .seg {
                display: flex;
                gap: 0.2rem;
                padding: 0.2rem;
                border: 1px solid var(--line);
                border-radius: 0.6rem;
            }
            .seg button {
                border: none;
                border-radius: 0.4rem;
                padding: 0.35rem 0.8rem;
                font-size: 0.75rem;
                letter-spacing: 0;
            }
            .seg button.active {
                color: var(--bg);
                background: var(--ink);
            }

            .confirm-text {
                padding: 1rem 1.4rem 0.2rem;
                font-size: 0.85rem;
                line-height: 1.55;
                color: var(--faint);
            }
            .confirm-text strong {
                color: var(--ink);
                font-weight: 500;
            }
            .modal-foot {
                display: flex;
                justify-content: flex-end;
                gap: 0.5rem;
                padding: 1.1rem 1.4rem 1.2rem;
            }
            .modal-foot button {
                font-size: 0.78rem;
                letter-spacing: 0;
                padding: 0.45rem 1rem;
                border-radius: 0.5rem;
            }
            button.danger {
                background: #dc2626;
                border-color: #dc2626;
                color: #fff;
            }
            button.danger:hover {
                background: #b91c1c;
                border-color: #b91c1c;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <header>
            <button
                id="menu"
                class="icon"
                title="Toggle sidebar"
                aria-label="Toggle sidebar"
                aria-expanded="true"
                aria-controls="sidebar"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <path d="M9 4v16" />
                </svg>
            </button>
            <h1 class="wordmark">note</h1>
            <span id="doc-title" class="doc-title" aria-hidden="true"></span>
            <button
                id="download"
                class="icon"
                title="Download as .txt (⌘S)"
                aria-label="Download note as text file"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path
                        d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                    />
                </svg>
            </button>
            <button
                id="settings-btn"
                class="icon"
                title="Settings"
                aria-label="Open settings"
                aria-haspopup="dialog"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                    />
                </svg>
            </button>
        </header>

        <main>
            <aside id="sidebar" aria-label="Notes">
                <div class="side-head">
                    <h2>Notes</h2>
                    <button
                        id="new-note"
                        class="icon"
                        title="New note"
                        aria-label="Create new note"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                </div>
                <ul id="note-list"></ul>
            </aside>
            <div id="scrim" aria-hidden="true"></div>

            <div class="editor">
                <div class="sheet">
                    <input
                        id="title"
                        type="text"
                        placeholder="Title"
                        spellcheck="false"
                        aria-label="Note title"
                        autocomplete="off"
                        maxlength="40"
                    />
                    <textarea
                        id="pad"
                        placeholder="Start typing…"
                        spellcheck="false"
                        aria-label="Note body"
                        autofocus
                    ></textarea>
                    <div class="status">
                        <span id="save-state" role="status">Loading…</span>
                        <span id="count" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
        </main>

        <div id="overlay" class="overlay" hidden>
            <div
                class="modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="settings-title"
            >
                <div class="modal-head">
                    <h2 id="settings-title">Settings</h2>
                    <button id="settings-close" aria-label="Close settings">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="row-label">
                            <strong>Theme</strong>
                            <span>Light or pure-black dark appearance</span>
                        </div>
                        <div
                            class="seg"
                            id="theme-seg"
                            role="group"
                            aria-label="Theme"
                        >
                            <button data-v="light">Light</button>
                            <button data-v="dark">Dark</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row-label">
                            <strong>Text size</strong>
                            <span>Editor font size</span>
                        </div>
                        <div
                            class="seg"
                            id="size-seg"
                            role="group"
                            aria-label="Text size"
                        >
                            <button data-v="0.85rem">Small</button>
                            <button data-v="0.95rem">Medium</button>
                            <button data-v="1.1rem">Large</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row-label">
                            <strong>Sidebar</strong>
                            <span>Show the notes list panel</span>
                        </div>
                        <div
                            class="seg"
                            id="sidebar-seg"
                            role="group"
                            aria-label="Sidebar"
                        >
                            <button data-v="on">Show</button>
                            <button data-v="off">Hide</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="confirm-overlay" class="overlay" hidden>
            <div
                class="modal"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="confirm-title"
                aria-describedby="confirm-text"
            >
                <div class="modal-head">
                    <h2 id="confirm-title">Delete note</h2>
                    <button id="confirm-x" aria-label="Close">×</button>
                </div>
                <p id="confirm-text" class="confirm-text"></p>
                <div class="modal-foot">
                    <button id="confirm-cancel">Cancel</button>
                    <button id="confirm-delete" class="danger">Delete</button>
                </div>
            </div>
        </div>

        <script>
            const pad = document.getElementById("pad");
            const titleInput = document.getElementById("title");
            const list = document.getElementById("note-list");
            const mobile = matchMedia("(max-width: 720px)");
            const LS = {
                active: "note.active",
                theme: "note.theme",
                size: "note.size",
            };
            localStorage.removeItem("note.sidebar");

            /* ---------- IndexedDB storage ----------
               "meta" holds {id, title, updated} for the sidebar;
               "bodies" holds each note's text, fetched only when opened. */

            let db;
            let notes = [];
            let activeId = null;

            function openDatabase() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open("notepad", 1);
                    request.onupgradeneeded = () => {
                        request.result.createObjectStore("meta", {
                            keyPath: "id",
                        });
                        request.result.createObjectStore("bodies");
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function asPromise(request) {
                return new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            function whenDone(tx) {
                return new Promise((resolve, reject) => {
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            }

            function readAllMeta() {
                return asPromise(
                    db.transaction("meta").objectStore("meta").getAll(),
                );
            }

            function readBody(id) {
                return asPromise(
                    db.transaction("bodies").objectStore("bodies").get(id),
                );
            }

            function writeNote(meta, text) {
                const tx = db.transaction(["meta", "bodies"], "readwrite");
                tx.objectStore("meta").put(meta);
                tx.objectStore("bodies").put(text, meta.id);
                return whenDone(tx);
            }

            function removeNote(id) {
                const tx = db.transaction(["meta", "bodies"], "readwrite");
                tx.objectStore("meta").delete(id);
                tx.objectStore("bodies").delete(id);
                return whenDone(tx);
            }

            function newId() {
                return (
                    Date.now().toString(36) +
                    Math.random().toString(36).slice(2, 6)
                );
            }

            function makeNote() {
                return { id: newId(), title: "", updated: Date.now() };
            }

            /* One-time move of notes saved by the old localStorage versions */
            async function migrateFromLocalStorage() {
                let oldNotes = null;
                try {
                    oldNotes = JSON.parse(localStorage.getItem("note.notes"));
                } catch (e) {}
                const oldSingle = localStorage.getItem("note.text");
                if (!Array.isArray(oldNotes) && oldSingle !== null)
                    oldNotes = [{ text: oldSingle }];
                if (!Array.isArray(oldNotes)) return;

                for (const old of oldNotes) {
                    let title = old.title;
                    let text = old.text || "";
                    if (title === undefined) {
                        const lines = text.split("\n");
                        title = (lines.shift() || "").trim();
                        text = lines.join("\n").replace(/^\n+/, "");
                    }
                    await writeNote(
                        {
                            id: old.id || newId(),
                            title: title.slice(0, 40),
                            updated: old.updated || Date.now(),
                        },
                        text,
                    );
                }
                localStorage.removeItem("note.notes");
                localStorage.removeItem("note.text");
            }

            function timeAgo(ts) {
                const mins = Math.floor((Date.now() - ts) / 60000);
                if (mins < 1) return "Just now";
                if (mins < 60) return mins + "m ago";
                const hours = Math.floor(mins / 60);
                if (hours < 24) return hours + "h ago";
                const days = Math.floor(hours / 24);
                if (days === 1) return "Yesterday";
                if (days < 7) return days + "d ago";
                return new Date(ts).toLocaleDateString(undefined, {
                    month: "short",
                    day: "numeric",
                });
            }
            function activeNote() {
                return notes.find((n) => n.id === activeId);
            }
            function titleOf(note) {
                return note.title.trim().slice(0, 40) || "Untitled";
            }

            const docTitle = document.getElementById("doc-title");

            async function openNote(id) {
                flushPendingSave();
                activeId = id;
                localStorage.setItem(LS.active, id);
                const text = (await readBody(id)) || "";
                if (activeId !== id) return;
                const note = activeNote();
                titleInput.value = note.title;
                pad.value = text;
                docTitle.textContent = titleOf(note);
                renderList();
                updateStatus();
                if (mobile.matches) setSidebar("off", true);
                if (titleInput.value) pad.focus();
                else titleInput.focus();
            }

            function renderList() {
                list.innerHTML = "";
                for (const note of notes) {
                    const li = document.createElement("li");
                    li.className =
                        "note-item" + (note.id === activeId ? " active" : "");
                    li.dataset.id = note.id;

                    const open = document.createElement("button");
                    open.className = "note-open";
                    const title = document.createElement("span");
                    title.className = "note-title";
                    title.textContent = titleOf(note);
                    const time = document.createElement("span");
                    time.className = "note-time";
                    time.textContent = timeAgo(note.updated);
                    open.append(title, time);
                    if (note.id === activeId)
                        open.setAttribute("aria-current", "true");
                    open.addEventListener("click", () => openNote(note.id));

                    const del = document.createElement("button");
                    del.className = "note-del";
                    del.textContent = "×";
                    del.setAttribute(
                        "aria-label",
                        'Delete note "' + titleOf(note) + '"',
                    );
                    del.addEventListener("click", () => deleteNote(note.id));

                    li.append(open, del);
                    list.append(li);
                }
            }

            async function deleteNote(id) {
                const note = notes.find((n) => n.id === id);
                const doDelete = async () => {
                    notes = notes.filter((n) => n.id !== id);
                    await removeNote(id);
                    if (notes.length === 0) {
                        const fresh = makeNote();
                        notes = [fresh];
                        await writeNote(fresh, "");
                    }
                    if (id === activeId) openNote(notes[0].id);
                    else renderList();
                };
                /* Empty notes are removed without asking */
                const text =
                    id === activeId ? pad.value : (await readBody(id)) || "";
                if (!note.title.trim() && !text.trim()) doDelete();
                else askDelete(note, doDelete);
            }

            /* ---------- Delete confirmation modal ---------- */

            const confirmOverlay = document.getElementById("confirm-overlay");
            const confirmText = document.getElementById("confirm-text");
            let confirmAction = null;

            function askDelete(note, action) {
                confirmText.innerHTML = "";
                confirmText.append(
                    "Are you sure you want to delete ",
                    Object.assign(document.createElement("strong"), {
                        textContent: "“" + titleOf(note) + "”",
                    }),
                    "? This cannot be undone.",
                );
                confirmAction = action;
                confirmOverlay.hidden = false;
                document.getElementById("confirm-cancel").focus();
            }
            function closeConfirm() {
                confirmOverlay.hidden = true;
                confirmAction = null;
            }
            document
                .getElementById("confirm-delete")
                .addEventListener("click", () => {
                    if (confirmAction) confirmAction();
                    closeConfirm();
                });
            document
                .getElementById("confirm-cancel")
                .addEventListener("click", closeConfirm);
            document
                .getElementById("confirm-x")
                .addEventListener("click", closeConfirm);
            confirmOverlay.addEventListener("click", (e) => {
                if (e.target === confirmOverlay) closeConfirm();
            });

            document
                .getElementById("new-note")
                .addEventListener("click", async () => {
                    const note = makeNote();
                    notes.unshift(note);
                    await writeNote(note, "");
                    openNote(note.id);
                });

            /* ---------- Editing & autosave ---------- */

            const saveState = document.getElementById("save-state");
            const countEl = document.getElementById("count");

            function updateStatus() {
                const text = pad.value;
                const words = text.trim()
                    ? text.trim().split(/\s+/).length
                    : 0;
                countEl.textContent =
                    words +
                    (words === 1 ? " word · " : " words · ") +
                    text.length +
                    (text.length === 1 ? " character" : " characters");
            }

            async function init() {
                db = await openDatabase();
                await migrateFromLocalStorage();
                notes = await readAllMeta();
                if (notes.length === 0) {
                    const first = makeNote();
                    notes = [first];
                    await writeNote(first, "");
                }
                notes.sort((a, b) => b.updated - a.updated);
                activeId = localStorage.getItem(LS.active);
                if (!notes.some((n) => n.id === activeId))
                    activeId = notes[0].id;
                const note = activeNote();
                titleInput.value = note.title;
                pad.value = (await readBody(activeId)) || "";
                docTitle.textContent = titleOf(note);
                renderList();
                updateStatus();
                saveState.textContent = "Saved";
            }

            /* Keep the sidebar timestamps fresh */
            setInterval(() => {
                for (const li of list.children) {
                    const note = notes.find((n) => n.id === li.dataset.id);
                    if (note)
                        li.querySelector(".note-time").textContent = timeAgo(
                            note.updated,
                        );
                }
            }, 60000);

            let saveTimer = null;

            function saveActiveNote() {
                saveTimer = null;
                const note = activeNote();
                if (!note) return;
                writeNote(note, pad.value)
                    .then(() => {
                        saveState.textContent = "Saved";
                    })
                    .catch((err) => {
                        console.error("Could not save note:", err);
                        saveState.textContent = "Save failed";
                    });
            }

            function flushPendingSave() {
                if (saveTimer === null) return;
                clearTimeout(saveTimer);
                saveActiveNote();
            }

            function onEdit() {
                const note = activeNote();
                if (!note) return;
                note.title = titleInput.value;
                note.updated = Date.now();
                docTitle.textContent = titleOf(note);
                const title = list.querySelector(
                    ".note-item.active .note-title",
                );
                if (title) title.textContent = titleOf(note);
                const time = list.querySelector(".note-item.active .note-time");
                if (time) time.textContent = timeAgo(note.updated);
                updateStatus();
                saveState.textContent = "Saving…";
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveActiveNote, 200);
            }
            pad.addEventListener("input", onEdit);
            titleInput.addEventListener("input", onEdit);

            /* Enter in the title moves to the body */
            titleInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    pad.focus();
                }
            });

            /* Flush an unsaved edit if the tab closes or goes to background
               within the debounce window */
            addEventListener("beforeunload", flushPendingSave);
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") flushPendingSave();
            });

            /* ---------- Settings ---------- */

            const overlay = document.getElementById("overlay");

            document
                .getElementById("settings-btn")
                .addEventListener("click", () => {
                    overlay.hidden = false;
                });
            document
                .getElementById("settings-close")
                .addEventListener("click", () => {
                    overlay.hidden = true;
                });
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) overlay.hidden = true;
            });
            addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    overlay.hidden = true;
                    closeConfirm();
                }
            });

            function initSeg(id, saved, apply) {
                const buttons = document.querySelectorAll("#" + id + " button");
                const set = (value, persist) => {
                    apply(value, persist);
                    buttons.forEach((b) => {
                        const on = b.dataset.v === value;
                        b.classList.toggle("active", on);
                        b.setAttribute("aria-pressed", on);
                    });
                };
                buttons.forEach((b) =>
                    b.addEventListener("click", () => set(b.dataset.v, true)),
                );
                set(saved, false);
                return set;
            }

            initSeg(
                "theme-seg",
                document.documentElement.dataset.theme,
                (t, persist) => {
                    document.documentElement.dataset.theme = t;
                    if (persist) localStorage.setItem(LS.theme, t);
                },
            );

            initSeg(
                "size-seg",
                localStorage.getItem(LS.size) || "0.95rem",
                (s, persist) => {
                    pad.style.fontSize = s;
                    if (persist) localStorage.setItem(LS.size, s);
                },
            );

            /* The sidebar starts visible on desktop, hidden on phones;
               hiding lasts for the session */
            const menuBtn = document.getElementById("menu");
            let sidebarState;
            const setSidebar = initSeg(
                "sidebar-seg",
                mobile.matches ? "off" : "on",
                (v) => {
                    sidebarState = v;
                    document.body.classList.toggle("no-sidebar", v === "off");
                    menuBtn.setAttribute("aria-expanded", v === "on");
                },
            );
            menuBtn.addEventListener("click", () =>
                setSidebar(sidebarState === "on" ? "off" : "on", true),
            );
            document
                .getElementById("scrim")
                .addEventListener("click", () => setSidebar("off", true));

            /* ---------- Download ---------- */

            function download() {
                if (!activeNote()) return;
                const heading = titleInput.value.trim();
                if (!pad.value.trim() && !heading) {
                    titleInput.focus();
                    return;
                }
                const content = heading
                    ? heading + "\n\n" + pad.value
                    : pad.value;
                const name =
                    (titleOf(activeNote()).replace(/[^\w\- ]/g, "").trim() ||
                        "note") + ".txt";
                const url = URL.createObjectURL(
                    new Blob([content], { type: "text/plain" }),
                );
                const a = Object.assign(document.createElement("a"), {
                    href: url,
                    download: name,
                });
                a.click();
                URL.revokeObjectURL(url);
            }

            document
                .getElementById("download")
                .addEventListener("click", download);
            addEventListener("keydown", (e) => {
                if ((e.metaKey || e.ctrlKey) && e.key === "s") {
                    e.preventDefault();
                    download();
                }
            });

            init().catch((err) => {
                console.error("Could not open note storage:", err);
                saveState.textContent = "Storage unavailable";
            });
        </script>
    </body>
</html>
