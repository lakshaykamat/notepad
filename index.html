<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Note - Minimal Notepad</title>
        <meta
            name="description"
            content="A fast, minimal notepad in your browser. Write multiple notes with autosave, pure-black dark mode, and .txt download. No account needed."
        />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Note - Minimal Notepad" />
        <meta
            property="og:description"
            content="A fast, minimal notepad in your browser. Multiple notes, autosave, dark mode, and .txt download."
        />
        <meta
            name="theme-color"
            content="#f7efdf"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#000000"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="apple-mobile-web-app-title" content="note" />
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111111'/%3E%3Ctext x='32' y='47' font-family='-apple-system,Segoe UI,Arial,sans-serif' font-size='42' font-weight='700' text-anchor='middle' fill='%23fff'%3En%3C/text%3E%3C/svg%3E"
        />
        <script>
            /* Apply saved theme before first paint to avoid a flash */
            (function () {
                var t = localStorage.getItem("note.theme");
                if (!t)
                    t = matchMedia("(prefers-color-scheme: dark)").matches
                        ? "dark"
                        : "light";
                document.documentElement.dataset.theme = t;
            })();
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <button
                id="menu"
                class="icon"
                title="Toggle sidebar"
                aria-label="Toggle sidebar"
                aria-expanded="true"
                aria-controls="sidebar"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <path d="M9 4v16" />
                </svg>
            </button>
            <h1 class="wordmark">note</h1>
            <span id="doc-title" class="doc-title" aria-hidden="true"></span>
            <button
                id="download"
                class="icon"
                title="Download as .txt (⌘S)"
                aria-label="Download note as text file"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <path
                        d="M12 3v12m0 0-4-4m4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"
                    />
                </svg>
            </button>
            <button
                id="settings-btn"
                class="icon"
                title="Settings"
                aria-label="Open settings"
                aria-haspopup="dialog"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <circle cx="12" cy="12" r="3" />
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                    />
                </svg>
            </button>
        </header>

        <main>
            <aside id="sidebar" aria-label="Notes">
                <div class="side-head">
                    <h2>Notes</h2>
                    <button
                        id="new-note"
                        class="icon"
                        title="New note"
                        aria-label="Create new note"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            aria-hidden="true"
                        >
                            <path d="M12 5v14M5 12h14" />
                        </svg>
                    </button>
                </div>
                <ul id="note-list"></ul>
            </aside>
            <div id="scrim" aria-hidden="true"></div>

            <div class="editor">
                <div class="sheet">
                    <input
                        id="title"
                        type="text"
                        placeholder="Title"
                        spellcheck="false"
                        aria-label="Note title"
                        autocomplete="off"
                        maxlength="40"
                    />
                    <textarea
                        id="pad"
                        placeholder="Start typing…"
                        spellcheck="false"
                        aria-label="Note body"
                        autofocus
                    ></textarea>
                    <div class="status">
                        <span id="save-state" role="status">Loading…</span>
                        <span id="count" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
        </main>

        <div id="overlay" class="overlay" hidden>
            <div
                class="modal"
                role="dialog"
                aria-modal="true"
                aria-labelledby="settings-title"
            >
                <div class="modal-head">
                    <h2 id="settings-title">Settings</h2>
                    <button id="settings-close" aria-label="Close settings">
                        ×
                    </button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="row-label">
                            <strong>Theme</strong>
                            <span>Light or pure-black dark appearance</span>
                        </div>
                        <div
                            class="seg"
                            id="theme-seg"
                            role="group"
                            aria-label="Theme"
                        >
                            <button data-v="light">Light</button>
                            <button data-v="dark">Dark</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row-label">
                            <strong>Text size</strong>
                            <span>Editor font size</span>
                        </div>
                        <div
                            class="seg"
                            id="size-seg"
                            role="group"
                            aria-label="Text size"
                        >
                            <button data-v="small">Small</button>
                            <button data-v="medium">Medium</button>
                            <button data-v="large">Large</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row-label">
                            <strong>Sidebar</strong>
                            <span>Show the notes list panel</span>
                        </div>
                        <div
                            class="seg"
                            id="sidebar-seg"
                            role="group"
                            aria-label="Sidebar"
                        >
                            <button data-v="on">Show</button>
                            <button data-v="off">Hide</button>
                        </div>
                    </div>
                    <div class="row">
                        <div class="row-label">
                            <strong>Backup</strong>
                            <span>Save or restore all notes as a JSON file</span>
                        </div>
                        <div class="row-actions">
                            <button id="export-notes">Export</button>
                            <button id="import-notes">Import</button>
                        </div>
                    </div>
                </div>
                <input
                    id="import-file"
                    type="file"
                    accept=".json,application/json"
                    hidden
                />
            </div>
        </div>

        <div id="confirm-overlay" class="overlay" hidden>
            <div
                class="modal"
                role="alertdialog"
                aria-modal="true"
                aria-labelledby="confirm-title"
                aria-describedby="confirm-text"
            >
                <div class="modal-head">
                    <h2 id="confirm-title">Delete note</h2>
                    <button id="confirm-x" aria-label="Close">×</button>
                </div>
                <p id="confirm-text" class="confirm-text"></p>
                <div class="modal-foot">
                    <button id="confirm-cancel">Cancel</button>
                    <button id="confirm-delete" class="danger">Delete</button>
                </div>
            </div>
        </div>

        <script type="module" src="js/app.js"></script>
    </body>
</html>
